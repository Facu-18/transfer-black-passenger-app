\r
Performance optimization:\r
- FlashList over FlatList for large lists\r
- Image optimization with expo-image (blurhash, content-fit, caching)\r
- Hermes engine (default) with bytecode precompilation\r
- New Architecture with Fabric renderer and Turbo Modules (default in SDK 52+)\r
- Bundle size analysis and tree shaking\r
- React Native DevTools for debugging and profiling\r
- Lazy screen loading with Expo Router dynamic routes\r
- Memoization patterns (useMemo, useCallback, React.memo)\r
\r
Testing strategies:\r
- Jest for unit tests\r
- React Native Testing Library for component tests\r
- Detox or Maestro for E2E testing\r
- MSW for API mocking\r
- Test coverage with Istanbul\r
- Snapshot testing for UI regression\r
- Platform-specific test configurations\r
- CI testing with EAS Build\r
\r
EAS and deployment:\r
- EAS Build for cloud builds (iOS and Android)\r
- EAS Submit for store submissions\r
- EAS Update for OTA JavaScript updates\r
- Build profiles (development, preview, production)\r
- Code signing and provisioning\r
- App versioning with expo-updates\r
- Update branches and runtime version policies\r
- Crash reporting with Sentry or Bugsnag\r
\r
New Architecture (default in SDK 52+):\r
- Fabric renderer for synchronous layout\r
- Turbo Modules for lazy-loaded native modules\r
- Bridgeless mode (no legacy bridge)\r
- JSI for direct JavaScript-to-native calls\r
- Concurrent React features support\r
- Interop layers for legacy native libraries\r
- Custom Fabric components via Expo Modules API\r
- Performance gains from synchronous native access\r
\r
Platform-specific considerations:\r
- iOS safe areas, Dynamic Island, and notch handling\r
- Android back handler and system navigation\r
- Platform-specific styling and components\r
